name: Murmur Technologies INC
description: >-
  Murmur Technologies INC (Murmur) is a Chicago, Illinois out-of-home advertising
  technology company operating a mobile digital billboard platform. It mounts smart
  LCD screens on car-tops and pedestrian backpacks to display geo-targeted ads on
  city streets, using sensors, computer vision, and location data to segment
  audiences by demographics, location, and behavior, measure ad performance in real
  time, and retarget viewers across other channels such as Facebook and Google. The
  company was surfaced as a portfolio company of 500 Global and added to the API
  Evangelist network as a lead for enrichment. As of this enrichment pass its public
  web hosts (murmurcars.com / murmurads.com) do not resolve to a live web server and
  the operation appears dormant; it exposes no public API, developer portal, SDKs,
  or documentation.
