name: Murmur Technologies INC
description: >-
  Murmur Technologies INC (Murmur) is a Chicago, Illinois out-of-home advertising
  technology company operating a mobile digital billboard platform. It mounts smart
  LCD screens on car-tops and pedestrian backpacks to display geo-targeted ads on
  city streets, using sensors, computer vision, and location data to segment
  audiences by demographics, location, and behavior, measure ad performance in real
  time, and retarget viewers across other channels such as Facebook and Google. The
  company was surfaced as a portfolio company of 500 Global and added to the API
  Evangelist network as a lead for enrichment. As of the 2026-08-12 enrichment pass
  the operation appears dormant: both marketing domains (murmurcars.com and
  murmurads.com) carry Route 53 nameservers but no A record at all, and the blog host
  times out. The one surviving surface is portal.murmurads.com, the advertiser portal,
  a static React single-page app served from Amazon S3 behind CloudFront whose last
  build shipped 2024-12-26. Its JavaScript bundle calls a private REST backend at
  backendapp.murmurcars.com/api/v1/ (campaigns, venues, zipcode demographics, GPS,
  air quality and user endpoints), but that host — while it still resolves — has TCP
  443 and 80 dead, so the portal front-end can no longer reach its own API. Murmur
  publishes no public API, developer portal, documentation, SDK, or machine-readable
  specification of any kind, and no package exists for it in any public registry.
